name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, fileinfo, mbstring, zip
          coverage: none
      - name: Lint PHP files
        run: find . -path './uploads' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run regression tests
        run: |
          php tests/security_regression.php
          php tests/docx_archive_regression.php
          php tests/logout_regression.php
